<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Culture Log</title>
    {% block head %}{% endblock %}
    <style>
      :root {
        --bg: #f2f6f4;
        --ink: #16302a;
        --muted: #5d726b;
        --line: #d3dfda;
        --accent: #1c7c6c;
        --danger: #b03a48;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        background: var(--ink);
      }
      header a {
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 1.2rem;
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 20px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0.4em 0;
      }
      .muted {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .btn {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 9px 16px;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .btn.ghost {
        background: none;
        color: var(--accent);
        border: 1px solid var(--accent);
      }
      .btn.danger {
        background: var(--danger);
      }
      .btn:focus-visible,
      input:focus-visible {
        outline: 3px solid #7cc6b9;
        outline-offset: 2px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      .card,
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .card {
        color: inherit;
        text-decoration: none;
      }
      .card:hover {
        border-color: var(--accent);
      }
      .card img,
      .noimg {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
      }
      .noimg {
        background: #e4ece8;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pad {
        padding: 12px 14px;
      }
      .panel {
        padding: 20px;
        margin-top: 12px;
      }
      .panel img {
        max-width: 100%;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .badge {
        font-size: 0.8rem;
        padding: 2px 9px;
        border-radius: 99px;
        background: #dcefe9;
        color: #155c50;
      }
      .badge.attention {
        background: #fdf0cf;
        color: #7a5a00;
      }
      .flash {
        background: #dcefe9;
        border: 1px solid #b5d9cf;
        padding: 10px 14px;
        border-radius: 6px;
        margin-top: 12px;
      }
      label {
        display: block;
        margin-bottom: 14px;
        font-weight: 600;
      }
      input[type="text"],
      input[type="date"],
      input[type="file"],
      select {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        font-weight: 400;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .error {
        display: block;
        color: var(--danger);
        font-weight: 400;
        font-size: 0.9rem;
        margin-top: 3px;
      }
      dl {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 6px 12px;
        margin: 0 0 16px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        word-break: break-all;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap"><a href="{{ url_for('index') }}">Home</a></div>
    </header>
    <main class="wrap">
      {% for m in get_flashed_messages() %}
      <div class="flash">{{ m }}</div>
      {% endfor %} {% block content %}{% endblock %}
    </main>
  </body>
</html>
